services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123!"
    ports: ["1433:1433"]
    volumes: ["motor_scoring_sql:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_password123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
  api:
    build:
      context: .
      dockerfile: src/MotorScoring.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MotorScoringDb: "Server=database,1433;Database=MotorScoring;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;Encrypt=False"
    ports: ["8080:8080"]
    depends_on:
      database:
        condition: service_healthy
volumes:
  motor_scoring_sql:
